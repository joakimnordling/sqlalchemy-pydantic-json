name: Feature request
description: Suggest a new feature or a change in behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case, and what makes it hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: How it could work, e.g. a code example of the API you have in mind.
