version: 2

# ruff and ty are pinned both in pyproject.toml and as pre-commit hook revs; one group for both
# ecosystems keeps them in the same PR.
multi-ecosystem-groups:
  python:
    schedule:
      interval: monthly

# Wait a week before proposing a new release, so a compromised upload has time to be caught and pulled.
# Security updates don't wait.
updates:
  - package-ecosystem: uv
    directory: /
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: python
    # This is a library: keep the `>=` lower bounds (they're the tested minimums), only move pins
    # that no longer allow the new version.
    versioning-strategy: increase-if-necessary

  - package-ecosystem: pre-commit
    directory: /
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: python

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
