name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  # uv's own Python builds (latest patch releases), never the runner's system Python
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          cache-suffix: pre-commit
      - run: uv sync --locked
      # the hook environments; building actionlint and shellcheck takes about a minute
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          cache-suffix: typecheck
      - run: uv sync --locked
      - name: mypy
        run: uv run mypy
      - name: mypy with the pydantic plugin (user-facing typing tests)
        run: uv run mypy --config-file tests/typing/mypy-pydantic-plugin.ini
      - name: pyright
        run: uv run pyright
      - name: ty
        run: uv run ty check
      # SQLModel requires SQLAlchemy < 2.1, so its tests are checked in an environment of their own,
      # which also checks everything else against SQLAlchemy 2.0
      - name: mypy on SQLAlchemy 2.0, with SQLModel
        run: |
          uv sync --locked --no-group sqlalchemy21 --group sqlmodel
          uv run --no-sync mypy src tests tests/test_sqlmodel.py

  test:
    name: test (Python ${{ matrix.python }}${{ matrix.deps != 'locked' && format(', {0} deps', matrix.deps) || '' }}${{ matrix.deps == 'locked' && matrix.groups == 'sqlmodel' && ', SQLModel' || '' }})
    runs-on: ubuntu-latest
    # pre-release Python versions don't block
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        # "locked": the versions in uv.lock. "lowest": the lowest allowed versions of the
        # dependencies (sqlalchemy, pydantic, ...). "latest": the newest allowed versions, i.e. what
        # a new user gets today; uv.lock may lag behind.
        deps: [locked]
        # "default": SQLAlchemy 2.1. "sqlmodel": SQLModel, which requires SQLAlchemy < 2.1 (so 2.0).
        groups: [default]
        include:
          # (an include that matched an existing combination would modify it, not add a job)
          - python: "3.11"
            deps: lowest
            groups: sqlmodel  # the lowest SQLAlchemy, 2.0.x, and the lowest SQLModel
          - python: "3.14"
            deps: latest
          - python: "3.14"
            deps: locked
            groups: sqlmodel
          - python: "3.15"
            deps: locked
            experimental: true
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 2s --health-retries 30
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_USER: test
          MARIADB_PASSWORD: test
          MARIADB_DATABASE: test
          MARIADB_ROOT_PASSWORD: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s --health-retries 30
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://test:test@localhost:5432/test
      TEST_MARIADB_URL: mariadb+pymysql://test:test@localhost:3306/test
      UV_PYTHON: ${{ matrix.python }}
      # Applies to every uv command in the job: `uv run` re-resolves if it differs from `uv sync`'s.
      UV_RESOLUTION: ${{ matrix.deps == 'lowest' && 'lowest-direct' || 'highest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          # one cache per kind of job; with the default key they all race to save the same one
          cache-suffix: test-${{ matrix.python }}-${{ matrix.deps }}
      - name: Install
        # latest: re-resolve to the newest versions (only on the runner; the repo's uv.lock is unchanged)
        run: uv sync ${{ matrix.deps == 'locked' && '--locked' || matrix.deps == 'latest' && '--upgrade' || '' }} ${{ matrix.groups == 'sqlmodel' && '--no-group sqlalchemy21 --group sqlmodel' || '' }}
      # --no-sync from here on: `uv run` would otherwise install the default groups again
      - name: Versions
        run: uv run --no-sync python -c "import sys, sqlalchemy, pydantic, alembic; print(sys.version, sqlalchemy.__version__, pydantic.VERSION, alembic.__version__)"
      - name: SQLModel
        if: matrix.groups == 'sqlmodel'
        # fails the job if it's missing (the SQLModel tests would only be skipped)
        run: uv run --no-sync python -c "import sqlmodel; print(sqlmodel.__version__)"
      - name: pytest
        run: uv run --no-sync pytest --cov --cov-report=term "--cov-report=markdown-append:$GITHUB_STEP_SUMMARY"
