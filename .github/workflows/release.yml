name: Release

# Publishing happens when a version tag is pushed, e.g. `git tag v0.0.1a1 && git push origin v0.0.1a1`.
# PyPI trusts this workflow through a "trusted publisher" (no token): repository joakimnordling/
# sqlalchemy-pydantic-json, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          cache-suffix: release
      - name: Check that the tag matches the version in pyproject.toml
        run: |
          version="$(uv version --short --color never)"  # FORCE_COLOR would add escape codes
          tag="${GITHUB_REF_NAME#v}"
          echo "version: $version, tag: $tag"
          test "$version" = "$tag"
      - run: uv build
      - name: Check the package
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi  # PyPI checks this name; it can also require your approval
    permissions:
      id-token: write  # for trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the section of CHANGELOG.md for this version, if it has one
          notes="$(awk -v tag="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" tag "\\]" {found = 1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "${notes:-See CHANGELOG.md}" \
            $(case "$GITHUB_REF_NAME" in *a*|*b*|*rc*) echo --prerelease;; esac)
