name: Release

# Publishing happens when a version tag is pushed, e.g. `git tag v0.0.1a1 && git push origin v0.0.1a1`.
# PyPI trusts this workflow through a "trusted publisher" (no token): repository joakimnordling/
# sqlalchemy-pydantic-json, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # all branches, to find main
      - name: Check that the tag is on main
        # Releases are made from main only, whose every commit has been through a PR and its CI.
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main; tag a commit on main to release it"
            exit 1
          fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          cache-suffix: release
      - name: Check that the tag matches the version in pyproject.toml
        run: |
          version="$(uv version --short --color never)"  # FORCE_COLOR would add escape codes
          tag="${GITHUB_REF_NAME#v}"
          echo "version: $version, tag: $tag"
          test "$version" = "$tag"
      - run: uv build
      - name: Check the package
        run: uvx twine==7.0.0 check --strict dist/*  # the same version as in ci.yml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi  # PyPI checks this name; it can also require your approval
    permissions:
      id-token: write  # for trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # all tags, to find the previous one
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the section of CHANGELOG.md for this version, if it has one, without the link definitions
          # at the bottom of the file (nothing in the section refers to them, so they'd be invisible)
          notes="$(awk -v tag="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" tag "\\]" {found = 1; next}
            found && /^## / {exit}
            found && !/^\[[^]]+\]: / {print}
          ' CHANGELOG.md)"
          repo="https://github.com/$GITHUB_REPOSITORY"
          changelog="[CHANGELOG.md]($repo/blob/$GITHUB_REF_NAME/CHANGELOG.md)"
          if prev="$(git describe --tags --abbrev=0 --exclude "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" 2>/dev/null)"; then
            footer="**Full changelog:** [$prev...$GITHUB_REF_NAME]($repo/compare/$prev...$GITHUB_REF_NAME) · $changelog"
          else
            footer="**Full changelog:** $changelog"
          fi
          prerelease=()
          case "$GITHUB_REF_NAME" in *a*|*b*|*rc*) prerelease=(--prerelease);; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "${notes:+$notes$'\n\n'}$footer" \
            "${prerelease[@]}"
