[project]
name = "sqlalchemy-pydantic-json"
version = "0.2.2"
description = "Pydantic models in SQLAlchemy JSON columns, with automatic mutation tracking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joakim Nordling", email = "joakim.nordling@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.44",  # 2.0.44: MutableList keeps an iterable value assigned to an index
    "pydantic>=2.12",  # 2.12: model_dump(exclude_computed_fields=...)
]
keywords = ["sqlalchemy", "pydantic", "json", "jsonb", "mutable", "mutation-tracking", "orm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/joakimnordling/sqlalchemy-pydantic-json"
Documentation = "https://github.com/joakimnordling/sqlalchemy-pydantic-json#readme"
Changelog = "https://github.com/joakimnordling/sqlalchemy-pydantic-json/blob/main/CHANGELOG.md"
Issues = "https://github.com/joakimnordling/sqlalchemy-pydantic-json/issues"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# The sdist carries the test suite, so a build from source can run it against the SQLAlchemy and
# Pydantic it has. Not in the wheel: `tests/` is outside `src/`.
[tool.uv.build-backend]
source-include = ["tests/**", "CHANGELOG.md"]
source-exclude = ["**/__pycache__", "**/*.pyc"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pyright==1.1.414",
    "ty==0.0.82",  # keep in sync with the ty-pre-commit rev,
    "pre-commit",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
    "pytest-cov>=6.3",  # 6.3: markdown reports (CI job summary)
    "fastapi>=0.133",  # 0.133: no upper bound on starlette, so lowest deps get one that uses httpx2
    "httpx2>=2",  # FastAPI's TestClient (starlette warns about plain httpx)
    "aiosqlite>=0.20",
    "greenlet>=3",
]
# SQLModel requires SQLAlchemy < 2.1, so it has a group of its own, which can't be installed together
# with the one testing SQLAlchemy 2.1: `uv sync --no-group sqlalchemy21 --group sqlmodel`.
sqlalchemy21 = ["sqlalchemy>=2.1"]
sqlmodel = ["sqlmodel>=0.0.22"]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev", "sqlalchemy21"]
conflicts = [[{ group = "sqlalchemy21" }, { group = "sqlmodel" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["sqlalchemy_pydantic_json"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# D213: a multi-line docstring starts its text on the line after the opening quotes
# S: security checks (bandit's rules); T10: leftover debugger calls
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D213", "S", "T10"]
# Pydantic fields with mutable defaults are fine (Pydantic copies them); ruff only knows that
# for direct BaseModel subclasses.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# the typing tests contain deliberately wrong lines
"tests/typing/*" = ["F841"]
# tests use plain asserts, and pickle and exec on purpose
"tests/*" = ["S"]

[tool.mypy]
strict = true
files = ["src", "tests"]  # tests/typing included: it must type-check like a user's code
cache_dir = ".cache/mypy"
# The casts are there for pyright, which narrows isinstance() on Any to list[Unknown]
# etc.; mypy narrows to list[Any] and would call them redundant.
warn_redundant_casts = false
# SQLModel isn't installed by default (see [dependency-groups]); CI checks this file in its own run.
exclude = ["^tests/test_sqlmodel\\.py$"]

[tool.pyright]
include = ["src", "tests/typing"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# The private classes in _model.py use each other's underscore members by design.
reportPrivateUsage = false
# tests/typing marks its planted errors with `# type: ignore`; an unneeded one means a missed error
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ty.src]
include = ["src", "tests/typing"]

[tool.ty.rules]
# tests/typing marks its planted errors with `# type: ignore`; an unneeded one means a missed error
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
